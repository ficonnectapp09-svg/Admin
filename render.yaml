services:
  - type: web
    name: connect-admin-backend
    runtime: node
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        value: ficonnectblr@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: OTP_EXPIRES_MINUTES
        value: 2
      - key: CLOUDINARY_CLOUD_NAME
        value: r6vovvet
      - key: CLOUDINARY_API_KEY
        value: "168714678711119"
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
